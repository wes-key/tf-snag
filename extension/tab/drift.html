<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>tf-snag</title>
  <script src="../lib/VSS.SDK.min.js"></script>
  <link rel="stylesheet" href="drift.css" />
</head>
<body>
  <!-- #root is the scroll container and fills the iframe; .tfd-content holds the
       report and is what gets measured. Keeping the two apart is what lets the
       tab grow when the host allows it and scroll when it does not. -->
  <div id="root" class="tfd-root">
    <div class="tfd-content">
      <p class="tfd-muted">Loading drift report&hellip;</p>
    </div>
  </div>
  <script src="drift.js"></script>
</body>
</html>
