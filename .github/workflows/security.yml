# Scans the tf-snag CLI and the Azure DevOps extension for known vulnerabilities.
#
#   govulncheck   the Go code, its modules and the Go standard library it is built
#                 with. Fails only on a vulnerability tf-snag's code can reach, so
#                 a flaw in a function we never call does not block a PR.
#   npm audit     the extension's npm packages. They are all build tooling
#                 (tfx-cli, the SDK) - nothing npm installs reaches an agent, since
#                 the tasks have no dependencies - so only high and critical fail.
#
# Runs on every PR and push to main, and weekly on main: a new advisory can make
# unchanged code vulnerable, and the README badge should say so without waiting
# for the next PR.
#
# Code scanning (CodeQL) and Dependabot are GitHub repo settings and
# .github/dependabot.yml respectively, not this workflow.

name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same Go that CI tests and releases build with - go.mod's version,
      # newest patch - so the standard library scanned is the one the binaries ship.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Scan
        run: govulncheck ./...

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Every package is a devDependency, so --omit=dev would audit nothing.
      - name: Audit
        run: npm audit --audit-level=high
