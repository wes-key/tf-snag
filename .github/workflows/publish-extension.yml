# Publishes the Azure DevOps tf-snag extension (extension/) to the Visual Studio
# Marketplace: the run tab and the tf-snag-install / tf-snag pipeline tasks.
#
# Runs two ways:
#   - prod, automatically, when a PR merged into main changed what goes into the
#     package (release.yml calls it, after the CLI release if there is one)
#   - either channel, on demand from the Actions tab - dev is manual only
#
# Visibility. vss-extension.json says "public": false, and that is what the dev
# channel always publishes. Prod publishes public once repo variable
# EXTENSION_PUBLIC is 'true' - which Microsoft only accepts from a verified
# publisher, so set it after verification, not before. Until then prod is private
# and shared with ADO_ORG.
#
# Prerequisites:
#   - a Marketplace publisher matching vss-extension.json "publisher" (wes-key),
#     created at https://marketplace.visualstudio.com/manage
#   - repo secret TFX_MARKETPLACE_TOKEN: an Azure DevOps PAT, "All accessible
#     organizations", scope Marketplace > Manage, owned by that publisher's account
#   - repo variable ADO_ORG: the Azure DevOps org to share a private publish with
#     (not needed for a dry run, or for prod once EXTENSION_PUBLIC is 'true')
#
# Version published is 0.<minor>.<patch>: minor from the manifest, patch one past
# the newest the Marketplace already has for that channel (tools/next-version.js).
# The Marketplace rejects re-publishing a version, and this workflow and
# release.yml each have their own run number, so asking it is the only counter
# both can share. Bump the minor in vss-extension.json for a deliberate step. The
# major stays 0: pipelines reference the tasks as tf-snag@0.
#
# The tasks are stamped with that same version by tools/stamp-tasks.js before
# packaging: an agent caches a task by id + version, so it keeps running the old
# copy until task.json says otherwise. On the dev channel that script also gives
# the tasks their own ids and a -dev name suffix, since task ids are global to an
# organisation and the two channels have to be installable side by side.

name: Publish ADO extension

on:
  workflow_call:
    inputs:
      channel:
        description: "prod or dev"
        type: string
        default: prod
      dry_run:
        description: "Package the .vsix as a build artifact but do not publish"
        type: boolean
        default: false
      ref:
        description: "Commit to package (empty: the commit the run is on)"
        type: string
        default: ""
    outputs:
      version:
        description: "The extension version packaged or published"
        value: ${{ jobs.publish.outputs.version }}
  workflow_dispatch:
    inputs:
      channel:
        description: "prod (tf-snag-tab) or dev (tf-snag-tab-dev, separate id)"
        type: choice
        options: [dev, prod]
        default: dev
      dry_run:
        description: "Package the .vsix as a build artifact but do not publish"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional: create a "marketplace" environment with required reviewers to
    # gate every publish behind a manual approval, and scope the PAT to it.
    # environment: marketplace
    outputs:
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Resolve version
        id: ver
        env:
          TFX_PAT: ${{ secrets.TFX_MARKETPLACE_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu -o pipefail
          if [ "$CHANNEL" != prod ] && [ "$CHANNEL" != dev ]; then
            echo "::error::channel must be prod or dev (got '$CHANNEL')"
            exit 1
          fi
          minor=$(node -p "require('./vss-extension.json').version.split('.')[1]")
          publisher=$(node -p "require('./vss-extension.json').publisher")
          if [ "$CHANNEL" = dev ]; then
            id=$(node -p "require('./configs/dev.json').id")
          else
            id=$(node -p "require('./vss-extension.json').id")
          fi
          if [ -z "${TFX_PAT:-}" ]; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "::error::secret TFX_MARKETPLACE_TOKEN is not set" >&2
              exit 1
            fi
            # A dry run publishes nothing, so any unused-looking version will do.
            echo "::notice::no Marketplace token - dry run packages as 0.${minor}.${GITHUB_RUN_NUMBER}"
            echo "version=0.${minor}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The Marketplace gallery API hangs often enough that tfx's own
          # three-minute timeout has failed a release before. A short cap and a
          # few attempts turns that into a slow run rather than a failed one.
          for attempt in 1 2 3 4; do
            if published=$(timeout 60 npx tfx-cli extension show --publisher "$publisher" --extension-id "$id" \
                --auth-type pat --token "$TFX_PAT" --json); then
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::could not read $publisher.$id from the Marketplace after $attempt attempts"
              exit 1
            fi
            echo "::warning::Marketplace lookup attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          version=$(node tools/next-version.js --minor "$minor" <<<"$published")
          echo "$publisher.$id -> $version" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stamp task versions (${{ inputs.channel }})
        run: node tools/stamp-tasks.js --version "${{ steps.ver.outputs.version }}" --channel "${{ inputs.channel }}"

      - name: "${{ inputs.dry_run && 'Package (dry run)' || 'Package and publish' }} — ${{ inputs.channel }} v${{ steps.ver.outputs.version }}"
        env:
          TFX_PAT: ${{ secrets.TFX_MARKETPLACE_TOKEN }}
          ADO_ORG: ${{ vars.ADO_ORG }}
          EXTENSION_PUBLIC: ${{ vars.EXTENSION_PUBLIC }}
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          public=false
          if [ "$CHANNEL" = prod ] && [ "${EXTENSION_PUBLIC:-}" = "true" ]; then
            public=true
          fi
          args=(--manifest-globs vss-extension.json --output-path dist
                --override "{\"version\":\"${VERSION}\",\"public\":${public}}")
          if [ "$CHANNEL" = dev ]; then
            args+=(--overrides-file configs/dev.json)
          fi
          echo "packaging $CHANNEL v$VERSION, public: $public"
          if [ "$DRY_RUN" = "true" ]; then
            npx tfx-cli extension create "${args[@]}"
            exit 0
          fi
          # A public extension is installable by anyone and cannot also be shared;
          # a private one is only visible to the orgs it is shared with.
          if [ "$public" = false ]; then
            if [ -z "${ADO_ORG:-}" ]; then
              echo "::error::variable ADO_ORG (the org to share the private extension with) is not set" >&2
              exit 1
            fi
            args+=(--share-with "$ADO_ORG")
          fi
          # --no-wait-validation: the upload is done by the time tfx starts
          # polling, and that poll times out against the Marketplace often
          # enough to mark a perfectly good publish as a failed run - which is
          # worse than not knowing, because the next thing you do is publish
          # again. Check it landed with:
          #   npx tfx-cli extension isvalid --publisher wes-key \
          #     --extension-id <id> --version <version> --token <PAT>
          npx tfx-cli extension publish "${args[@]}" \
            --auth-type pat --token "$TFX_PAT" \
            --no-wait-validation

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tf-snag-tab-${{ inputs.channel }}-${{ steps.ver.outputs.version }}
          path: extension/dist/*.vsix
          if-no-files-found: error
