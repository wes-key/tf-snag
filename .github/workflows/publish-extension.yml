# Publishes the Azure DevOps tf-snag extension (extension/) to the Visual Studio
# Marketplace: the run tab and the tf-snag-install / tf-snag pipeline tasks.
#
# The extension is PRIVATE (vss-extension.json "public": false): it never shows
# in Marketplace search and is only installable by orgs it is shared with, which
# this workflow does via --share-with. To make it public later, flip "public" to
# true in the manifest (a public listing then goes through Microsoft review).
#
# Runs two ways:
#   - prod, automatically, after every stable release (release.yml calls it)
#   - either channel, on demand from the Actions tab
#
# Prerequisites:
#   - a Marketplace publisher matching vss-extension.json "publisher" (wes-key),
#     created at https://marketplace.visualstudio.com/manage
#   - repo secret TFX_MARKETPLACE_TOKEN: an Azure DevOps PAT, "All accessible
#     organizations", scope Marketplace > Manage, owned by that publisher's account
#   - repo variable ADO_ORG: the Azure DevOps org to share the private extension
#     with (required for a real publish; not needed for a dry run)
#
# Version published is 0.<minor>.<patch>: minor from the manifest, patch one past
# the newest the Marketplace already has for that channel (tools/next-version.js).
# The Marketplace rejects re-publishing a version, and this workflow and
# release.yml each have their own run number, so asking it is the only counter
# both can share. Bump the minor in vss-extension.json for a deliberate step. The
# major stays 0: pipelines reference the tasks as tf-snag@0.
#
# The tasks are stamped with that same version by tools/stamp-tasks.js before
# packaging: an agent caches a task by id + version, so it keeps running the old
# copy until task.json says otherwise. On the dev channel that script also gives
# the tasks their own ids and a -dev name suffix, since task ids are global to an
# organisation and the two channels have to be installable side by side.

name: Publish ADO extension

on:
  workflow_call:
    inputs:
      channel:
        description: "prod or dev"
        type: string
        default: prod
      dry_run:
        description: "Package the .vsix as a build artifact but do not publish"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      channel:
        description: "prod (tf-snag-tab) or dev (tf-snag-tab-dev, separate id)"
        type: choice
        options: [dev, prod]
        default: dev
      dry_run:
        description: "Package the .vsix as a build artifact but do not publish"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional: create a "marketplace" environment with required reviewers to
    # gate every publish behind a manual approval, and scope the PAT to it.
    # environment: marketplace
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Resolve version
        id: ver
        env:
          TFX_PAT: ${{ secrets.TFX_MARKETPLACE_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu -o pipefail
          if [ "$CHANNEL" != prod ] && [ "$CHANNEL" != dev ]; then
            echo "::error::channel must be prod or dev (got '$CHANNEL')"
            exit 1
          fi
          minor=$(node -p "require('./vss-extension.json').version.split('.')[1]")
          publisher=$(node -p "require('./vss-extension.json').publisher")
          if [ "$CHANNEL" = dev ]; then
            id=$(node -p "require('./configs/dev.json').id")
          else
            id=$(node -p "require('./vss-extension.json').id")
          fi
          if [ -z "${TFX_PAT:-}" ]; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "::error::secret TFX_MARKETPLACE_TOKEN is not set" >&2
              exit 1
            fi
            # A dry run publishes nothing, so any unused-looking version will do.
            echo "::notice::no Marketplace token - dry run packages as 0.${minor}.${GITHUB_RUN_NUMBER}"
            echo "version=0.${minor}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(npx tfx-cli extension show --publisher "$publisher" --extension-id "$id"             --auth-type pat --token "$TFX_PAT" --json | node tools/next-version.js --minor "$minor")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stamp task versions (${{ inputs.channel }})
        run: node tools/stamp-tasks.js --version "${{ steps.ver.outputs.version }}" --channel "${{ inputs.channel }}"

      - name: "${{ inputs.dry_run && 'Package (dry run)' || 'Package and publish' }} — ${{ inputs.channel }} v${{ steps.ver.outputs.version }}"
        env:
          TFX_PAT: ${{ secrets.TFX_MARKETPLACE_TOKEN }}
          ADO_ORG: ${{ vars.ADO_ORG }}
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          args=(--manifest-globs vss-extension.json --output-path dist
                --override "{\"version\":\"${VERSION}\"}")
          if [ "$CHANNEL" = dev ]; then
            args+=(--overrides-file configs/dev.json)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            npx tfx-cli extension create "${args[@]}"
          else
            if [ -z "${ADO_ORG:-}" ]; then
              echo "::error::variable ADO_ORG (the org to share the extension with) is not set" >&2
              exit 1
            fi
            # --no-wait-validation: the upload is done by the time tfx starts
            # polling, and that poll times out against the Marketplace often
            # enough to mark a perfectly good publish as a failed run - which is
            # worse than not knowing, because the next thing you do is publish
            # again. Check it landed with:
            #   npx tfx-cli extension isvalid --publisher wes-key \
            #     --extension-id <id> --version <version> --token <PAT>
            npx tfx-cli extension publish "${args[@]}" \
              --auth-type pat --token "$TFX_PAT" \
              --share-with "$ADO_ORG" \
              --no-wait-validation
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tf-snag-tab-${{ inputs.channel }}-${{ steps.ver.outputs.version }}
          path: extension/dist/*.vsix
          if-no-files-found: error
