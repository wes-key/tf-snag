# Build, test, and release the tf-snag CLI.
#
#   tf-snag       linux/amd64    (for CI agents)
#   tf-snag.exe   windows/amd64  (for local use)
#
# vet + test run on every pull request and on pushes to main.
#
# Releases are tag-driven. Push an annotated tag and CI builds both binaries,
# stamps the version, and publishes a GitHub Release:
#
#   git tag v0.1.0-dev.1 && git push origin v0.1.0-dev.1   -> pre-release
#   git tag v0.1.0-rc.1  && git push origin v0.1.0-rc.1    -> pre-release
#   git tag v0.1.0       && git push origin v0.1.0         -> latest release
#
# A tag containing a hyphen (dev.N / rc.N / ...) is marked as a GitHub
# pre-release, so only a bare vX.Y.Z becomes "latest". The drift pipeline in
# tf-drift-test-resources downloads the linux binary from the latest release,
# i.e. it ignores pre-releases.

name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build linux + windows binaries
        run: |
          set -eux -o pipefail
          VER="${GITHUB_REF_NAME#v}"
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not vX.Y.Z or vX.Y.Z-<pre>"
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p dist
          # Stamp the version so `tf-snag -version` reports it.
          ldflags="-s -w -X main.version=$VER"
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o dist/tf-snag .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o dist/tf-snag.exe .
          ./dist/tf-snag -version
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Hyphen in the tag (v0.1.0-dev.1, -rc.1, ...) => pre-release.
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/tf-snag dist/tf-snag.exe \
            --title "$GITHUB_REF_NAME" \
            --notes "tf-snag $VER (linux/amd64 + windows/amd64)" \
            $prerelease
