# Vet, test and lint the tf-snag CLI and its Azure DevOps extension.
#
# vet + test run on every pull request and on pushes to main, alongside a lint of
# the Azure DevOps extension in extension/ (its tasks have no build step).
#
# Stable releases are not cut here: label a PR release:patch / minor / major and
# merging it releases (see release.yml).
#
# Pre-releases are tag-driven. Push a hyphenated tag and CI builds both binaries
# and publishes it as a GitHub pre-release (build-release.yml):
#
#   git tag v1.1.0-dev.1 && git push origin v1.1.0-dev.1
#   git tag v1.1.0-rc.1  && git push origin v1.1.0-rc.1
#
# A bare vX.Y.Z pushed by hand is refused, so every stable release goes through
# release.yml and carries its notes and extension publish.

name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: go test ./...

  # The Azure DevOps extension has no build and no test runner, so this is the
  # only thing standing between a typo and a published task that fails on an
  # agent - which you would find out about after a publish, an install and a
  # pipeline run. Merging a PR that touches the package publishes it (release.yml),
  # so this is also the last check before the Marketplace.
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Syntax-check the extension scripts
        run: |
          set -eu
          find tab tasks tools -name '*.js' -print0 |
            xargs -0 -n1 node --check
      - name: Lint the task manifests
        run: node tools/check-tasks.js
      - run: npm ci --no-audit --no-fund
      # Packaged exactly as prod publishes it, public flag included, so a manifest
      # the Marketplace would refuse fails here rather than after the merge.
      - name: Package the extension
        run: |
          node tools/stamp-tasks.js --version 0.0.0 --channel prod
          npx tfx-cli extension create --manifest-globs vss-extension.json --output-path dist \
            --override '{"version":"0.0.0","public":true}'

  guard:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a stable tag pushed by hand
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*) echo "$TAG is a pre-release tag" ;;
            *)
              echo "::error::$TAG is a stable tag. Stable releases come from merging a PR labelled release:patch / minor / major (release.yml). Delete the tag: git push origin :refs/tags/$TAG"
              exit 1
              ;;
          esac

  release:
    needs: [test, guard]
    permissions:
      contents: write
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ github.ref_name }}
      ref: ${{ github.sha }}
